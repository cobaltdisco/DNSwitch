name: DNSwitch
options:
  bundleIdPrefix: com.fx
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"

targets:
  DNSwitch:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: DNSwitch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fx.dnswitch
        MARKETING_VERSION: "0.19"
        CURRENT_PROJECT_VERSION: "19"
        GENERATE_INFOPLIST_FILE: YES
        # App icon (Finder / Dock / Get Info): the Liquid Glass witch, a macOS 26
        # Icon Composer bundle at DNSwitch/AppIcon.icon — actool compiles it and
        # bakes a pre-Tahoe .icns. Regenerate with packaging/appicon/make-appicon.sh.
        # (The menu-bar glyph is a SEPARATE SF-style imageset, MenuWitchOn/Off.)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Menu-bar only, no Dock icon.
        INFOPLIST_KEY_LSUIElement: YES
        # NOT sandboxed on purpose (G4): must connect to the root-owned control
        # socket, which App Sandbox would block. No .entitlements => no sandbox.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z48W7TAXR4
        # Swift 5 language mode — relaxed concurrency for the thin socket client.
        SWIFT_VERSION: "5.0"
    # Build the Go engine, embed it at Contents/MacOS/dnswitch-engine + the
    # LaunchDaemon plist, and sign the engine — all before Xcode's final
    # code-sign seals the bundle (docs/07 §1). Runs as the last pre-sign phase.
    postBuildScripts:
      - script: '"$SRCROOT/../packaging/build-engine.sh"'
        name: Embed & sign engine daemon
        basedOnDependencyAnalysis: false

  # Pure-logic unit tests (docs/12 §6 S03). Deliberately NOT hosted by the App:
  # no TEST_HOST and no dependency on the DNSwitch target, so a test run never
  # launches a com.fx.dnswitch build (which could heal/rewrite the launchd
  # service) and never builds the engine. The App's non-UI sources are compiled
  # straight into the bundle instead.
  DNSwitchTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: DNSwitchTests
      - path: DNSwitch/Models.swift
      - path: DNSwitch/AppModel.swift
      - path: DNSwitch/SocketClient.swift
      - path: DNSwitch/ServiceManager.swift
      - path: DNSwitch/SystemDNSProbe.swift
      - path: DNSwitch/LoginItem.swift
      - path: DNSwitch/StatusItemClicks.swift
      - path: DNSwitch/QAMockEngine.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fx.dnswitch.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z48W7TAXR4

schemes:
  # Spelled out because declaring any scheme here stops Xcode from creating
  # its automatic one; DNSwitch is the scheme the QA release candidate builds,
  # with the same settings as before. Tests get their own scheme so
  # `xcodebuild test` builds nothing else.
  DNSwitch:
    build:
      targets:
        DNSwitch: all
  DNSwitchTests:
    build:
      targets:
        DNSwitchTests: [test]
    test:
      targets:
        - DNSwitchTests
